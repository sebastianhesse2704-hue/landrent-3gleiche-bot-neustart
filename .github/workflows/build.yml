name: LandRent Bot Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Projekt entpacken
        run: |
          rm -rf project
          mkdir project
          unzip -q LandRent_3Gleiche_Bot_NEUSTART_CLEAN.zip -d project

      - name: APK bauen
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LandRent-3Gleiche-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
